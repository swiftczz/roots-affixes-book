name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v), e.g. 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage PDF
        run: |
          # 从仓库取本地编译好的 PDF,直接用中文书名作为发版资产
          cp "typst/词根词缀的故事.pdf" "词根词缀的故事.pdf"
          ls -lh *.pdf

      - name: Generate changelog
        if: steps.ver.outputs.is_tag == 'true'
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [[ -z "$prev_tag" ]]; then
            echo "## 首次发版" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s" >> CHANGELOG.md
          else
            echo "## 更新内容（${prev_tag} → ${{ github.ref_name }}）" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s" "${prev_tag}..${{ github.ref_name }}" >> CHANGELOG.md
          fi
          echo "=== changelog ==="
          cat CHANGELOG.md

      - name: Create Release and Upload PDF
        if: steps.ver.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "词根词缀的故事.pdf" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --generate-notes

      - name: Upload PDF as workflow artifact
        if: steps.ver.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: roots-affixes-pdf-v${{ steps.ver.outputs.version }}
          path: "词根词缀的故事.pdf"
