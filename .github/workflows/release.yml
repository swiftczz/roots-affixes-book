name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without leading v), e.g. 0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage PDF
        run: |
          # 从仓库取本地编译好的 PDF。资产名用 ASCII + 版本号
          # (GitHub Release 资产名只支持 ASCII,中文名会被服务端回退成 default)
          cp "typst/词根词缀的故事.pdf" "roots-affixes-book-v${{ steps.ver.outputs.version }}.pdf"
          ls -lh roots-affixes-book-v*.pdf

      - name: Generate changelog
        if: steps.ver.outputs.is_tag == 'true'
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [[ -z "$prev_tag" ]]; then
            echo "## 首次发版" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s" >> CHANGELOG.md
          else
            echo "## 更新内容（${prev_tag} → ${{ github.ref_name }}）" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s" "${prev_tag}..${{ github.ref_name }}" >> CHANGELOG.md
          fi
          echo "=== changelog ==="
          cat CHANGELOG.md

      - name: Upload PDF to Release
        if: steps.ver.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: "roots-affixes-book-v*.pdf"
          body_path: CHANGELOG.md
          generate_release_notes: true

      - name: Upload PDF as workflow artifact
        if: steps.ver.outputs.is_tag == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: roots-affixes-pdf-v${{ steps.ver.outputs.version }}
          path: "roots-affixes-book-v*.pdf"
